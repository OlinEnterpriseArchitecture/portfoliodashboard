name: Convert Excel to JSON

on:
  push:
    paths:
      - 'data/uploads/**.xlsx'
      - 'data/uploads/**.xls'

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas openpyxl

      - name: Convert Excel to JSON
        run: python .github/scripts/excel_to_json.py

      - name: Format JSON and inject timestamp
        run: |
          DATE="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          jq --arg date "$DATE" '. + {_meta: {lastUpdated: $date}}' \
            data/json/All_Projects.json > tmp.json && mv tmp.json data/json/All_Projects.json

      - name: Commit JSON output
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update All_Projects.json"
          file_pattern: "data/json/All_Projects.json"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          push_options: '--force-with-lease'
