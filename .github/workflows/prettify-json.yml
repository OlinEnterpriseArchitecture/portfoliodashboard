name: Prettify JSON

on:
  push:
    paths:
      - '**.json'

jobs:
  prettify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Format JSON with jq
        run: |
          find . -name "*.json" \
            -not -path "./.github/*" \
            -exec sh -c 'jq . "$1" > tmp.json && mv tmp.json "$1"' _ {} \;

      - name: Inject last updated timestamp into data files
        run: |
          DATE="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          for f in data/json/*.json; do
            [ -f "$f" ] || continue
            jq --arg date "$DATE" '. + {_meta: {lastUpdated: $date}}' \
              "$f" > tmp.json && mv tmp.json "$f"
          done

      - name: Commit formatted JSON
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-format JSON"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
